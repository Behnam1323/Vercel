<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel VLESS Generator</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background-color: #1e1e1e; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #00d4ff; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #333; 
            border-radius: 8px; 
            background-color: #2d2d2d; 
            color: #fff; 
            box-sizing: border-box;
            font-family: monospace;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            cursor: pointer; 
            background: linear-gradient(45deg, #0070f3, #00c6ff); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        #link-output { 
            font-size: 11px; 
            word-break: break-all; 
            margin-top: 15px; 
            padding: 10px; 
            background-color: #000; 
            border-radius: 8px; 
            color: #00ff00; 
            text-align: left;
            direction: ltr;
            min-height: 60px;
        }
        .copy-btn {
            background: #333;
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>تولید کانفیگ VLESS</h2>
        <p style="font-size: 12px; color: #aaa;">UUID خود را وارد کنید</p>
        <input type="text" id="uuid" placeholder="مثلا: 00000000-0000-0000-0000-000000000000">
        <button onclick="generateLink()">تولید و کپی لینک</button>
        <div id="link-output"></div>
        <button class="copy-btn" onclick="copyLink()">کپی لینک</button>
    </div>

    <script>
        function generateLink() {
            const uuidInput = document.getElementById('uuid').value.trim();
            if (!uuidInput) {
                alert("لطفا یک UUID معتبر وارد کنید.");
                return;
            }

            // دریافت آدرس فعلی (همان دامنه ورسل شما)
            const domain = window.location.hostname; 
            
            // ساخت کانفیگ VLESS + WS + TLS
            // این فرمت استاندارد برای V2RayNG و Clash است
            const path = "/?ed=2048";
            const configString = `vless://${uuidInput}@${domain}:443?encryption=none&security=tls&sni=${domain}&fp=randomized&type=ws&host=${domain}&path=${encodeURIComponent(path)}#${domain}-Vercel`;
            
            document.getElementById('link-output').innerText = configString;
        }

        function copyLink() {
            const linkText = document.getElementById('link-output').innerText;
            if (!linkText) return alert("ابتدا لینک را تولید کنید");
            
            navigator.clipboard.writeText(linkText).then(() => {
                alert("لینک با موفقیت کپی شد! حالا آن را در V2RayNG ایمپورت کنید.");
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
